<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSA City Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <a href="index.html" class="nav-blue">YOUR CITY</a>
        <a href="profile.html" class="nav-red">MY PROFILE</a>
        <a href="concert.html" class="nav-yellow">Concerts</a>
        <a href="blackbook.html" class="nav-white">Explore<br>The Black Book</a>
        <a href="#" class="nav-purple">Maps</a>
    </nav>
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>

    <header>
        <h1 id="city-title">CCSA</h1>
    </header>

    <div id="city-map"></div>

    <aside id="city-panel">
        <h2 id="panel-headline">Headline goes here</h2>
        <img id="panel-image" src="images/jhb.jpg" alt="City sketch">
        <p id="panel-text">A short description of the city goes here.</p>
        <div class="panel-buttons">
            <button>Contribute</button>
            <button>Save a spot</button>
            <button>Share</button>
        </div>
    </aside>

    <button id="city-badge" aria-label="Open city info">
        <img id="badge-image" src="images/jhb.jpg" alt="">
        <span id="badge-label">JHB</span>
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="city.js"></script>
</body>
</html>
