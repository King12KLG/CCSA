<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSA City Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <a href="index.html" class="nav-blue">YOUR CITY</a>
        <a href="profile.html" class="nav-red">MY PROFILE</a>
        <a href="concert.html" class="nav-yellow">My Concert</a>
        <a href="blackbook.html" class="nav-white">Explore<br>The Black Book</a>
    </nav>
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>

    <header>
        <h1 id="city-title">CCSA</h1>
    </header>

    <div id="city-map"></div>

    <aside id="city-panel" class="open">
        <p id="panel-text">A short description of the city goes here.</p>
        <img id="panel-image" src="images/jhb.jpg" alt="City sketch">

        <div id="weather-box" class="weather-box" aria-live="polite"></div>

        <h3 class="category-title">Category</h3>
        <div class="category-list">
            <button id="food-btn">FOOD</button>
            <button id="shopping-btn">SHOPPING</button>
            <button id="concert-btn">VENUES</button>
        </div>

        <a href="blackbook.html" class="blackbook-link">
            <span class="b-badge">B</span>
            <span class="b-text">Explore<br>The Black Book</span>
        </a>

        <a href="concert.html" class="blackbook-link concert-link" data-concert-link>
            <span class="b-badge concert">&#9834;</span>
            <span class="b-text">My<br>Concert</span>
        </a>

        <div class="panel-buttons">
            <button>Contribute</button>
            <button>Save a spot</button>
            <button>Share</button>
        </div>
    </aside>

    <button id="city-badge" aria-label="Open city info">
        <img id="badge-image" src="images/jhb.jpg" alt="">
        <span id="badge-label">JHB</span>
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="city.js"></script>
    <script src="contribute.js"></script>
    <script src="badge.js"></script>
</body>
</html>
