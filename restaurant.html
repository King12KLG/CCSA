<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSA Restaurant</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <a href="index.html" class="nav-blue">YOUR CITY</a>
        <a href="profile.html" class="nav-red">MY PROFILE</a>
        <a href="concert.html" class="nav-yellow">My Concert</a>
        <a href="blackbook.html" class="nav-white">Explore<br>The Black Book</a>
    </nav>
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>

    <header>
        <h1 id="city-title">CCSA</h1>
    </header>

    <div id="city-map"></div>

    <aside id="city-panel" class="open">
        <a href="blackbook.html" class="blackbook-head">
            <span class="b-badge">B</span>
            <span>My BLACK BOOK</span>
        </a>

        <div class="rest-photo">
            <img id="rest-photo" src="images/jhb.jpg" alt="">
        </div>
        <p id="rest-blurb" class="panel-note"></p>

        <div class="rate-box">
            <span id="rate-question"></span>
            <div class="stars" id="stars" aria-label="Your rating"></div>
        </div>

        <div class="panel-buttons">
            <button>Contribute</button>
            <button>Save a spot</button>
            <button>Share</button>
        </div>
    </aside>

    <div class="rest-card" id="rest-card"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="spots.js"></script>
    <script src="card.js"></script>
    <script src="restaurant.js"></script>
    <script src="contribute.js"></script>
    <script src="badge.js"></script>
</body>
</html>
