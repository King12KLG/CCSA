<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggest a place | CCSA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="suggest-body">
    <main class="suggest-card">
        <h1>Suggest a place</h1>
        <p>Fill out this box and suggest a place you think we missed at CCSA.</p>

        <form id="suggest-form">
            <label for="suggestion">Your suggestion</label>
            <textarea id="suggestion" rows="6" maxlength="1000" required
                placeholder="The name of the place, which city it is in, and why it belongs in the Black Book..."></textarea>
            <button type="submit" class="send-btn">Send</button>
        </form>

        <p id="suggest-thanks" class="suggest-thanks" hidden>Sent! Thank you for helping us grow the Black Book.</p>
    </main>

    <button type="button" id="back-btn" class="back-btn">Back</button>

    <script src="suggest.js"></script>
</body>
</html>
