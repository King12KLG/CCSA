<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSA Category</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="sidebar">
        <a href="index.html" class="nav-blue">YOUR CITY</a>
        <a href="profile.html" class="nav-red">MY PROFILE</a>
        <a href="concert.html" class="nav-yellow">Concerts</a>
        <a href="blackbook.html" class="nav-white">Explore<br>The Black Book</a>
        <a href="#" class="nav-purple">Maps</a>
    </nav>
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>

    <header>
        <h1 id="city-title">CCSA</h1>
    </header>

    <div id="city-map"></div>

    <aside id="city-panel" class="open">
        <p id="cat-headline" class="panel-note"></p>
        <img id="panel-image" src="images/jhb.jpg" alt="City sketch">
        <p id="food-text" class="panel-note"></p>

        <button id="spots-toggle" class="spots-toggle" aria-pressed="true">
            <span id="spots-label">Food spots</span>
            <span class="switch"></span>
        </button>

        <a href="blackbook.html" class="blackbook-link">
            <span class="b-badge">B</span>
            <span class="b-text">Explore<br>The Black Book</span>
        </a>

        <div class="panel-buttons">
            <button>Contribute</button>
            <button>Save a spot</button>
            <button>Share</button>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="spots.js"></script>
    <script src="food.js"></script>
    <script src="contribute.js"></script>
    <script src="badge.js"></script>
</body>
</html>
