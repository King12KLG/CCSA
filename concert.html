<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCSA My Concert</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="loader.js"></script>
    <nav id="sidebar">
        <a href="index.html" class="nav-blue">YOUR CITY</a>
        <a href="profile.html" class="nav-red">MY PROFILE</a>
        <a href="concert.html" class="nav-yellow">My Concert</a>
        <a href="blackbook.html" class="nav-white">Explore<br>The Black Book</a>
    </nav>
    <button id="menu-btn" aria-label="Open menu">&#9776;</button>

    <header>
        <h1>CCSA (Concerts Company South Africa)</h1>
    </header>

    <div id="city-map"></div>

    <aside id="city-panel" class="open">
        <div class="concert-head">
            <span class="b-badge concert small">&#9834;</span>
            <h2>My Concert</h2>
        </div>

        <div class="blackbook-image">
            <img id="concert-photo" src="" alt="">
        </div>

        <p id="concert-text" class="panel-note"></p>

        <div class="rate-box concert-rate">
            <span id="rate-question"></span>
        </div>
        <div class="stars" id="stars" aria-label="Your rating"></div>

        <a id="explore-city" href="city.html" class="concert-btn">Explore</a>

        <div class="panel-buttons">
            <button>Contribute</button>
            <button>Save a spot</button>
            <button>Share</button>
        </div>
    </aside>

    <div class="concert-card" id="concert-card">
        <div class="cc-tabs">
            <button type="button" class="cc-tab active" data-tab="concert" aria-pressed="true">MY CONCERT</button>
            <button type="button" class="cc-tab" data-tab="tips" aria-pressed="false">Concert Tips</button>
            <button type="button" class="cc-tab" data-tab="artist" aria-pressed="false">Your Artist</button>
        </div>

        <div class="concert-card-body" id="cc-body"></div>

        <h2 id="cc-title"></h2>
        <div class="concert-card-foot">
            <span>User reviews</span>
            <span><span id="cc-rating"></span> &middot; <button type="button" class="rate-now" id="rate-now">RATE NOW</button></span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="concerts-data.js"></script>
    <script src="concert.js"></script>
    <script src="contribute.js"></script>
    <script src="badge.js"></script>
</body>
</html>
